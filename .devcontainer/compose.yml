services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/tech-career-platform:cached
      - tcp-uv-cache:/home/vscode/.cache/uv
      - tcp-npm-cache:/home/vscode/.npm
      - tcp-pnpm-store:/home/vscode/.local/share/pnpm/store
    working_dir: /workspaces/tech-career-platform
    command: sleep infinity
    ports:
      - "8000:8000"
      - "4200:4200"
    environment:
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: copy
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/platform_dev
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  tcp-postgres-data:
  tcp-uv-cache:
  tcp-npm-cache:
  tcp-pnpm-store:
